set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g set-clipboard on
setw -g mode-keys vi

# ── WezTerm reading-column sync ────────────────────────────────
# Report side-by-side pane count on every layout change; WezTerm
# adjusts pixel padding to fit N centered 75-col columns.
# Script linked to ~/.local/bin by terminal-setup/install-terminal.sh.
set -g allow-passthrough on
set-hook -g after-split-window  'run-shell -b ~/.local/bin/tmux-panecols'
set-hook -g pane-exited         'run-shell -b ~/.local/bin/tmux-panecols'
set-hook -g window-layout-changed 'run-shell -b ~/.local/bin/tmux-panecols'
set-hook -g after-resize-pane   'run-shell -b ~/.local/bin/tmux-panecols'  # zoom = resize-pane -Z
set-hook -g session-window-changed 'run-shell -b ~/.local/bin/tmux-panecols'
set-hook -g client-attached     'run-shell -b ~/.local/bin/tmux-panecols'
